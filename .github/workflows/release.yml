# Release pipeline for theDAW.
#
# Trigger: pushing a tag that matches v* (for example v0.1.0), or a manual
# workflow_dispatch run for a dry build without a release.
#
# Release scheme (ONE coherent flow, documented in docs/RELEASING.md):
#   1. The version-check job verifies that the tag, electron-ui/package.json,
#      and pyproject.toml all agree on the version, then creates a DRAFT
#      GitHub Release for the tag.
#   2. The artifact jobs (windows-exe, macos-dmg) build installers, upload
#      them as short-lived workflow artifacts, and attach them to that draft
#      release with `gh release upload --clobber`.
#   3. The docker-ghcr job pushes the container image to GHCR.
#   4. A human reviews the draft release, writes notes, and publishes it.
#      CI never publishes the release on its own.
#
# House style follows .github/workflows/lint.yml: ubuntu-latest where
# possible, first-party actions only (actions/*), versions pinned via env
# vars with sync-rule comments, and no third-party actions.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# The default token stays read-only; individual jobs elevate only the
# scopes they need (contents: write for release uploads, packages: write
# for GHCR pushes).
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # SwayCommand (the SWAY tab's cockpit) is public, so the installer jobs check
  # it out with the built-in GITHUB_TOKEN and build the embed bundle from it
  # (electron-ui/scripts/fetch-sway-build.mjs via SWAY_PROJECT). It used to be
  # private, which is why SWAY_REPO_TOKEN exists; the secret is still honoured
  # when present so a fork with its own PAT keeps working, and its absence no
  # longer fails the build. SWAY_REF is the branch whose newest commit the
  # packaged app ships; the checkout step logs the commit it built.
  SWAY_REPO: danieljtrujillo/SwayCommand
  SWAY_REF: main

jobs:
  # Resolves the release version and fails fast on any version drift
  # between the tag, electron-ui/package.json, and pyproject.toml.
  # electron-ui/package.json is the version authority; pyproject.toml
  # must carry the identical string (sync rule in docs/RELEASING.md).
  version-check:
    runs-on: ubuntu-latest
    # This job creates the draft GitHub Release on tag pushes, so it needs
    # write access to repository contents.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve and verify the release version
        id: resolve
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(jq -r .version electron-ui/package.json)"
          fi
          PKG_VERSION="$(jq -r .version electron-ui/package.json)"
          PY_VERSION="$(grep -Po '^version\s*=\s*"\K[^"]+' pyproject.toml | head -n 1)"
          echo "Resolved version: $VERSION"
          echo "electron-ui/package.json version: $PKG_VERSION"
          echo "pyproject.toml version: $PY_VERSION"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch: the release ref resolves to $VERSION but electron-ui/package.json declares $PKG_VERSION."
            exit 1
          fi
          if [ "$VERSION" != "$PY_VERSION" ]; then
            echo "::error::Version mismatch: the release ref resolves to $VERSION but pyproject.toml declares $PY_VERSION."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      # SwayCommand is public now, so the default token reads it. This step
      # reports which credential the installer jobs will use rather than
      # failing: the hard failure here is what broke every fork run, where the
      # secret does not exist and never needed to.
      - name: Report the SwayCommand credential
        env:
          SWAY_REPO_TOKEN: ${{ secrets.SWAY_REPO_TOKEN }}
        run: |
          if [ -n "$SWAY_REPO_TOKEN" ]; then
            echo "Checking out ${SWAY_REPO} with SWAY_REPO_TOKEN."
          else
            echo "Checking out ${SWAY_REPO} with the built-in GITHUB_TOKEN (the repository is public)."
          fi
      # Creating the draft release here (rather than in an artifact job)
      # avoids a race between windows-exe and macos-dmg both trying to
      # create it first. The artifact jobs only upload into it.
      - name: Create the draft GitHub Release for this tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; artifact jobs will upload into it."
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "theDAW $GITHUB_REF_NAME" \
              --notes "Draft release created by the release workflow. The Windows installer and the macOS disk image are attached by CI. A maintainer reviews and publishes this release manually; see docs/RELEASING.md."
          fi

  # Builds the Windows NSIS installer and attaches it to the draft release.
  # The installer is unsigned, so SmartScreen shows a warning on first run
  # (documented in docs/RELEASING.md).
  windows-exe:
    runs-on: windows-latest
    needs: version-check
    # This job attaches the installer to the draft GitHub Release, so it
    # needs write access to repository contents.
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version-check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # frontend/.nvmrc is the single Node pin for CI, the frontend and the
          # Electron shell (test.yml reads the same file).
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            electron-ui/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install electron-ui dependencies
        run: npm ci
        working-directory: electron-ui
      # Check SwayCommand out at the pinned commit and point the fetch script
      # at it. The script installs its deps and runs
      # `npm run build:renderer:embed` (renderer only; no Electron download).
      - name: Check out SwayCommand
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SWAY_REPO }}
          ref: ${{ env.SWAY_REF }}
          token: ${{ secrets.SWAY_REPO_TOKEN || github.token }}
          path: SwayCommand
      # The live VST3 host is a native Windows program that is never committed.
      # electron-builder.yml ships build-resources/vst-host as resources/vst-host
      # and the shell points the backend at it, but nothing built or staged the
      # host here, so every installer up to v0.2.0 went out without live VST3.
      # The steps mirror build-vst-host.yml; `npm run stage:vst-host` in the
      # dist:win chains copies native/vst-host/bin into build-resources.
      - name: Build the live VST3 host
        run: |
          cmake -S native/vst-host -B build/vst-host -A x64 -DTHEDAW_VST3=ON -DTHEDAW_WERROR=ON -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "cmake configure (host) failed with exit code $LASTEXITCODE" }
          cmake --build build/vst-host --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "cmake build (host) failed with exit code $LASTEXITCODE" }
          cmake -S native/vst-host/src/vst3 -B build/vst-host-vst3-probe -A x64 -DTHEDAW_WERROR=ON -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "cmake configure (vst3_probe) failed with exit code $LASTEXITCODE" }
          cmake --build build/vst-host-vst3-probe --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "cmake build (vst3_probe) failed with exit code $LASTEXITCODE" }
          New-Item -ItemType Directory -Force -Path native/vst-host/bin | Out-Null
          $hostExe = @('build/vst-host/Release/thedaw-vst-host.exe', 'build/vst-host/thedaw-vst-host.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $hostExe) { throw 'thedaw-vst-host.exe was not found under build/vst-host' }
          Copy-Item -Force $hostExe native/vst-host/bin/thedaw-vst-host.exe
          $probeExe = Get-ChildItem -Path build -Filter 'vst3_probe.exe' -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($probeExe) { Copy-Item -Force $probeExe.FullName native/vst-host/bin/vst3_probe.exe }
          & native/vst-host/bin/thedaw-vst-host.exe --selftest
          if ($LASTEXITCODE -ne 0) { throw "thedaw-vst-host.exe --selftest failed with exit code $LASTEXITCODE" }
      - name: Build the Windows installer
        env:
          SWAY_PROJECT: ${{ github.workspace }}/SwayCommand
        run: npm run dist:win:ci
        working-directory: electron-ui
      # The installer is only worth uploading with the host inside it: the
      # staging step leaves a README and exits 0 when the host is missing, so a
      # broken host build would otherwise ship a release without live VST3.
      - name: Check the installer carries the live VST3 host
        run: |
          $exe = 'electron-ui/release/win-unpacked/resources/vst-host/thedaw-vst-host.exe'
          if (-not (Test-Path $exe)) { throw "$exe is missing: the packaged app would have no live VST3." }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "the packaged host exited $LASTEXITCODE" }
      - uses: actions/upload-artifact@v7
        with:
          name: theDAW-Setup-${{ env.VERSION }}-exe
          path: electron-ui/release/theDAW-Setup-${{ env.VERSION }}.exe
          if-no-files-found: error
          retention-days: 7
      # latest.yml + the .blockmap are the electron-updater feed: the packaged
      # app reads latest.yml from the newest published release to find and
      # download the installer in place (electron-ui/main/index.ts). Without
      # them Settings > Update can only open the release page. Every release
      # up to v0.1.9 shipped the installer alone, because the upload step
      # below named only the .exe -- the guard is here so the feed cannot go
      # missing again without failing the build.
      - name: Check the update feed was written
        shell: bash
        run: |
          for f in \
            "electron-ui/release/latest.yml" \
            "electron-ui/release/theDAW-Setup-${VERSION}.exe.blockmap"
          do
            if [ ! -f "$f" ]; then
              echo "::error::electron-builder did not write $f. The packaged app reads latest.yml from the release to self-update, so the release cannot ship without it. Check the publish: key in electron-ui/electron-builder.yml."
              exit 1
            fi
          done
          echo "Update feed present:"
          cat electron-ui/release/latest.yml
      - name: Attach the installer and the update feed to the draft release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "electron-ui/release/theDAW-Setup-${VERSION}.exe" \
            "electron-ui/release/theDAW-Setup-${VERSION}.exe.blockmap" \
            "electron-ui/release/latest.yml" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  # Builds the macOS disk image and attaches it to the draft release.
  # The dmg is unsigned and un-notarized because no Apple Developer
  # certificate is configured: Gatekeeper blocks a plain double-click, so
  # users must right-click the app and choose Open, or clear quarantine
  # with `xattr -d com.apple.quarantine`. The dmg targets arm64 (Apple
  # Silicon) only. First launch bootstraps the Python backend with uv and
  # downloads several GB of dependencies and model weights.
  macos-dmg:
    runs-on: macos-latest
    needs: version-check
    # This job attaches the disk image to the draft GitHub Release, so it
    # needs write access to repository contents.
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version-check.outputs.version }}
      # Disabling certificate auto-discovery keeps electron-builder from
      # attempting to code-sign with whatever identity the runner keychain
      # happens to expose; the build is intentionally unsigned.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # frontend/.nvmrc is the single Node pin for CI, the frontend and the
          # Electron shell (test.yml reads the same file).
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            electron-ui/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install electron-ui dependencies
        run: npm ci
        working-directory: electron-ui
      # dist:mac:ci runs the darwin-aware tool fetch itself; this mkdir is
      # purely defensive so the build cannot fail on a missing directory.
      - name: Ensure the bundled-tools directory exists
        run: mkdir -p electron-ui/resources/tools
      # Check SwayCommand out at the pinned commit and point the fetch script
      # at it. The script installs its deps and runs
      # `npm run build:renderer:embed` (renderer only; no Electron download).
      - name: Check out SwayCommand
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SWAY_REPO }}
          ref: ${{ env.SWAY_REF }}
          token: ${{ secrets.SWAY_REPO_TOKEN || github.token }}
          path: SwayCommand
      # FFmpeg for the Apple Silicon app, built from the latest FFmpeg release
      # with libsoxr and librubberband (no maintained static arm64 build has
      # both). electron-ui/scripts/build-ffmpeg-macos.sh verifies the tarball's
      # signature, links Homebrew's libraries, and relinks every dylib into
      # ffmpeg-libs/ beside the binaries so the app never loads the user's
      # Homebrew. The build is cached under a key made of the FFmpeg version,
      # a hash of every Homebrew formula version it links, and the script
      # itself, so it rebuilds only when one of those changes.
      - name: Resolve the FFmpeg build key
        id: ffmpeg-key
        run: |
          brew update --quiet
          key="$(bash electron-ui/scripts/build-ffmpeg-macos.sh key)"
          echo "FFmpeg build key: $key"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Restore the built FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: electron-ui/build-resources/ffmpeg-macos-arm64
          key: ffmpeg-macos-arm64-${{ steps.ffmpeg-key.outputs.key }}-${{ hashFiles('electron-ui/scripts/build-ffmpeg-macos.sh') }}
      - name: Build FFmpeg from source
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: bash electron-ui/scripts/build-ffmpeg-macos.sh build
      # Runs on a cache hit too: the soxr and rubberband probes, the encoders
      # theDAW uses, code signatures, and no /opt/homebrew or /usr/local path
      # left in any `otool -L` or rpath. Any failure fails the job.
      - name: Verify the built FFmpeg
        run: bash electron-ui/scripts/build-ffmpeg-macos.sh verify
      - name: Build the macOS disk image
        env:
          SWAY_PROJECT: ${{ github.workspace }}/SwayCommand
          # The tool fetch must use the FFmpeg built above, never fall back.
          THEDAW_MAC_FFMPEG_REQUIRED: "1"
        run: npm run dist:mac:ci
        working-directory: electron-ui
      - uses: actions/upload-artifact@v7
        with:
          name: theDAW-${{ env.VERSION }}-arm64-dmg
          path: electron-ui/release/theDAW-${{ env.VERSION }}-arm64.dmg
          if-no-files-found: error
          retention-days: 7
      - name: Attach the disk image to the draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "electron-ui/release/theDAW-${VERSION}-arm64.dmg" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  # Builds the container image from the root Dockerfile and pushes it to
  # GHCR. Tag pushes publish :VERSION and :latest; dispatch builds publish
  # a :sha-<shortsha> tag instead so they never move :latest.
  docker-ghcr:
    runs-on: ubuntu-latest
    needs: version-check
    permissions:
      contents: read
      # Pushing to the GitHub Container Registry requires the packages
      # write scope on the default token.
      packages: write
    env:
      VERSION: ${{ needs.version-check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # Plain `docker login` with the default token keeps this job free of
      # third-party actions (house rule from lint.yml).
      - name: Log in to the GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      # The image goes to the namespace of the repository running the workflow:
      # ghcr.io/gantasmo/thedaw on gantasmo/theDAW, the image documented in
      # docs/RELEASING.md. GITHUB_TOKEN can write packages only for its own
      # owner, so a fixed gantasmo name failed the push on every fork. GHCR
      # names are lowercase, hence ${,,}.
      - name: Build and push the image
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/thedaw"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            docker buildx build --push \
              --tag "${IMAGE_NAME}:${VERSION}" \
              --tag "${IMAGE_NAME}:latest" \
              .
          else
            docker buildx build --push \
              --tag "${IMAGE_NAME}:sha-${GITHUB_SHA::7}" \
              .
          fi
